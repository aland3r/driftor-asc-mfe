name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: testes unitários e de arquitetura
        run: npm test
      - name: build
        run: npm run build
        env:
          VITE_API_URL: https://driftor-asc-apim.azure-api.net
